<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#4DB8FF"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Pip"/>
<meta name="description" content="Bright, playful trading journal"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" type="image/png" href="icon-192.png"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<title>Pip — Trading Journal</title>
<style>
:root{
  --bg:#FFFBF5; --bg2:#FFF5EB; --card:#FFFFFF;
  --txt:#2D1B0E; --mut:#8B7355;
  --sky:#4DB8FF; --sky2:#3DA8EF;
  --lime:#4ADE80; --lime2:#22C55E;
  --berry:#FF6B6B; --berry2:#EF4444;
  --mango:#FFB84D; --grape:#B983FF;
  --gold:#FFD93D;
  --r:22px; --r-sm:14px;
  --shadow:0 4px 20px rgba(45,27,14,.06);
  --shadow-lg:0 12px 40px rgba(45,27,14,.12);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --font: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, "Nunito", "Quicksand", sans-serif;
}
[data-theme="calm"]{
  --bg:#F5F7FA; --bg2:#EBEFF5; --txt:#1F2937; --mut:#6B7280;
  --sky:#8FA9C9; --sky2:#7A96B6;
  --lime:#6B9B7A; --lime2:#5A8A6A;
  --berry:#C97B6B; --berry2:#B96B5B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:var(--font);background:var(--bg);color:var(--txt);overflow-x:hidden;transition:background .3s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;font-family:inherit;position:relative;overflow:hidden}
input,select,textarea{font:inherit;color:inherit;font-family:inherit}
::selection{background:var(--sky);color:#fff}
#app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:calc(80px + var(--safe-b))}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 8px;position:sticky;top:0;background:var(--bg);z-index:10}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;letter-spacing:-.3px}
.brand .pip-mini{width:32px;height:32px}
.actions{display:flex;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:14px;background:var(--card);border:1px solid rgba(0,0,0,.06);display:grid;place-items:center;font-size:18px;transition:transform .15s;box-shadow:var(--shadow)}
.icon-btn:active{transform:scale(.92)}
main{flex:1;padding:0 16px}
.view{animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.month-card{padding:24px 20px;border-radius:var(--r);margin:8px 0 12px;color:#fff;position:relative;overflow:hidden;transition:all .3s}
.month-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.25),transparent 60%);pointer-events:none}
.month-card.pos{background:linear-gradient(135deg,var(--lime),var(--lime2));box-shadow:0 10px 30px rgba(74,222,128,.35)}
.month-card.neg{background:linear-gradient(135deg,var(--berry),var(--berry2));box-shadow:0 10px 30px rgba(255,107,107,.35)}
.month-card.neu{background:linear-gradient(135deg,var(--sky),var(--grape));box-shadow:0 10px 30px rgba(77,184,255,.35)}
.month-card .month-name{font-size:15px;font-weight:700;opacity:.95;letter-spacing:.5px;position:relative}
.month-card .month-total{font-size:28px;font-weight:800;margin-top:8px;letter-spacing:-.5px;position:relative}
.month-card .month-total b{font-weight:900}
.month-card .mood{font-size:32px;position:absolute;top:16px;inset-inline-end:20px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin:12px 0 8px;gap:8px}
.nav-btn{padding:8px 16px;border-radius:12px;background:var(--card);border:1px solid rgba(0,0,0,.06);font-weight:700;font-size:14px;box-shadow:var(--shadow);transition:transform .15s}
.nav-btn:active{transform:scale(.95)}
.nav-btn.big{font-size:18px;padding:8px 14px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:8px 0 16px}
.calendar .wd{text-align:center;font-size:11px;font-weight:700;color:var(--mut);padding:6px 0;text-transform:uppercase;letter-spacing:.5px}
.day{aspect-ratio:1;border-radius:14px;background:var(--card);border:1px solid rgba(0,0,0,.04);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;transition:all .2s;cursor:pointer;font-size:15px;font-weight:700;overflow:hidden;animation:dayIn .4s backwards}
@keyframes dayIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.day:active{transform:scale(.92)}
.day.empty{background:transparent;border:none;pointer-events:none;animation:none}
.day.today{border:2px solid var(--sky);box-shadow:0 0 0 3px rgba(77,184,255,.15)}
.day.sel{transform:scale(1.05);border:2px solid var(--txt);z-index:2}
.day.win{background:linear-gradient(135deg,var(--lime),var(--lime2));color:#fff;box-shadow:0 3px 10px rgba(74,222,128,.35)}
.day.loss{background:linear-gradient(135deg,var(--berry),var(--berry2));color:#fff;box-shadow:0 3px 10px rgba(255,107,107,.35)}
.day.neutral{background:linear-gradient(135deg,var(--mango),#F5A623);color:#fff}
.day .amt{font-size:10px;font-weight:800;opacity:.95;margin-top:1px}
.day .n{font-size:14px;font-weight:800}
.detail-card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.detail-title{font-size:13px;font-weight:700;color:var(--mut);margin-bottom:10px;text-transform:uppercase;letter-spacing:.4px}
.detail-list{display:flex;flex-direction:column;gap:8px}
.trade-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg2);animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
.trade-row .ico{font-size:16px}
.trade-row .note{flex:1;font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trade-row .amt{font-weight:800;font-size:14px}
.trade-row.win .amt{color:var(--lime2)}
.trade-row.loss .amt{color:var(--berry2)}
.empty-detail{text-align:center;padding:20px;color:var(--mut);font-size:13px}
#fab{position:fixed;bottom:calc(88px + var(--safe-b));inset-inline-end:20px;width:64px;height:64px;border-radius:22px;background:linear-gradient(135deg,var(--sky),var(--grape));color:#fff;font-size:32px;font-weight:300;display:grid;place-items:center;box-shadow:0 10px 30px rgba(77,184,255,.5);z-index:30;transition:transform .15s;animation:float 3s ease-in-out infinite}
#fab:active{transform:scale(.92)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:var(--card);border-top:1px solid rgba(0,0,0,.06);display:flex;justify-content:space-around;padding:8px 8px calc(8px + var(--safe-b));z-index:20;box-shadow:0 -4px 20px rgba(45,27,14,.06)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:14px;color:var(--mut);font-size:11px;font-weight:700;transition:all .25s}
.tab .ico{font-size:22px;transition:transform .2s}
.tab.on{color:var(--sky)}
.tab.on .ico{transform:scale(1.15) translateY(-1px)}
.tab:active .ico{transform:scale(.9)}
.modal{position:fixed;inset:0;background:rgba(45,27,14,.5);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;z-index:100}
.modal.open{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:520px;background:var(--card);border-radius:28px 28px 0 0;padding:22px 20px calc(24px + var(--safe-b));max-height:92dvh;overflow-y:auto;animation:slideUp .35s cubic-bezier(.2,.9,.2,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.sheet h2{margin:0 0 16px;font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.sheet-close{width:34px;height:34px;border-radius:12px;background:var(--bg2);display:grid;place-items:center;font-size:16px;color:var(--mut);margin-inline-start:auto}
.amount-input{width:100%;background:var(--bg2);border:2px solid transparent;border-radius:18px;padding:20px;font-size:36px;font-weight:900;text-align:center;color:var(--txt);outline:none;transition:all .2s;letter-spacing:-1px}
.amount-input:focus{border-color:var(--sky);background:var(--card);box-shadow:0 0 0 4px rgba(77,184,255,.15)}
.type-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.type-btn{padding:20px 12px;border-radius:18px;background:var(--bg2);border:2px solid transparent;font-weight:800;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .2s;color:var(--mut)}
.type-btn .e{font-size:26px}
.type-btn.on.win{background:linear-gradient(135deg,var(--lime),var(--lime2));color:#fff;border-color:var(--lime2);box-shadow:0 8px 20px rgba(74,222,128,.4);transform:scale(1.02)}
.type-btn.on.loss{background:linear-gradient(135deg,var(--berry),var(--berry2));color:#fff;border-color:var(--berry2);box-shadow:0 8px 20px rgba(255,107,107,.4);transform:scale(1.02)}
.type-btn:active{transform:scale(.96)}
.note-input{width:100%;background:var(--bg2);border:2px solid transparent;border-radius:14px;padding:14px 16px;font-size:16px;outline:none;transition:all .2s}
.note-input:focus{border-color:var(--sky);background:var(--card)}
.btn{width:100%;padding:18px;border-radius:18px;font-weight:800;font-size:16px;transition:all .2s;margin-top:12px}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--sky),var(--grape));color:#fff;box-shadow:0 8px 20px rgba(77,184,255,.4)}
.btn-ghost{background:var(--bg2);color:var(--txt)}
.btn-danger{background:rgba(255,107,107,.12);color:var(--berry2)}
.stat-hero{padding:26px;border-radius:var(--r);margin:8px 0 16px;color:#fff;background:linear-gradient(135deg,var(--sky),var(--grape));box-shadow:0 10px 30px rgba(77,184,255,.35);text-align:center}
.stat-hero .lbl{font-size:13px;opacity:.9;font-weight:700;letter-spacing:.5px}
.stat-hero .val{font-size:44px;font-weight:900;margin:6px 0;letter-spacing:-1px}
.stat-hero .sub{font-size:13px;opacity:.85}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat-card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);text-align:center}
.stat-card .e{font-size:28px;margin-bottom:6px}
.stat-card .lbl{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.stat-card .val{font-size:20px;font-weight:900;letter-spacing:-.3px}
.stat-card.good .val{color:var(--lime2)}
.stat-card.bad .val{color:var(--berry2)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.badge{aspect-ratio:1;border-radius:16px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;opacity:.35;transition:all .3s}
.badge.on{opacity:1;background:linear-gradient(135deg,var(--gold),var(--mango));color:#2D1B0E;box-shadow:0 6px 20px rgba(255,217,61,.4)}
.badge .e{font-size:26px}
.badge .n{font-size:9px;font-weight:800;text-align:center;line-height:1.2}
.section-title{font-size:13px;font-weight:800;color:var(--mut);letter-spacing:.5px;text-transform:uppercase;margin:20px 0 10px}
.set-card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid rgba(0,0,0,.05);gap:12px}
.set-row:last-child{border-bottom:none}
.set-row .lbl{font-weight:700;font-size:15px}
.set-row .sub{font-size:11px;color:var(--mut);margin-top:2px}
.set-row select{background:var(--bg2);border:1px solid rgba(0,0,0,.06);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;max-width:150px;color:var(--txt)}
.toggle{width:50px;height:28px;background:var(--bg2);border-radius:99px;position:relative;transition:all .25s;cursor:pointer;flex-shrink:0;border:1px solid rgba(0,0,0,.06)}
.toggle::after{content:'';position:absolute;top:2px;inset-inline-start:2px;width:22px;height:22px;background:#fff;border-radius:50%;transition:all .25s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.toggle.on{background:linear-gradient(135deg,var(--lime),var(--lime2))}
.toggle.on::after{inset-inline-start:calc(100% - 24px)}
.lang-list{display:flex;flex-direction:column;gap:6px}
.lang-btn{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--bg2);border-radius:14px;font-weight:700;font-size:15px;transition:all .15s}
.lang-btn:active{transform:scale(.98)}
.lang-btn.on{background:linear-gradient(135deg,var(--sky),var(--grape));color:#fff}
.lang-btn .flag{font-size:22px}
#toast{position:fixed;bottom:calc(100px + var(--safe-b));left:50%;transform:translate(-50%,20px);background:var(--txt);color:#fff;padding:12px 20px;border-radius:14px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:all .3s;z-index:300;max-width:90vw;text-align:center;box-shadow:var(--shadow-lg)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rip .6s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
@media (min-width:520px){#app{border-left:1px solid rgba(0,0,0,.05);border-right:1px solid rgba(0,0,0,.05)}}
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="brand">
      <svg class="pip-mini" viewBox="0 0 100 100">
        <defs><linearGradient id="pg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4DB8FF"/><stop offset="1" stop-color="#B983FF"/></linearGradient></defs>
        <circle cx="50" cy="50" r="46" fill="url(#pg1)"/>
        <circle cx="36" cy="46" r="6" fill="#fff"/>
        <circle cx="64" cy="46" r="6" fill="#fff"/>
        <circle cx="38" cy="44" r="2.5" fill="#2D1B0E"/>
        <circle cx="66" cy="44" r="2.5" fill="#2D1B0E"/>
        <path d="M38 66 Q50 76 62 66" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      </svg>
      <span>Pip</span>
    </div>
    <div class="actions">
      <button class="icon-btn" id="langBtn" aria-label="Language">🌐</button>
      <button class="icon-btn" id="themeBtn" aria-label="Theme">🎨</button>
    </div>
  </header>

  <main id="view"></main>

  <button id="fab" aria-label="Add trade">+</button>

  <nav>
    <button class="tab on" data-tab="calendar"><span class="ico">🏠</span><span data-i18n="calendar">Calendar</span></button>
    <button class="tab" data-tab="stats"><span class="ico">📊</span><span data-i18n="stats">Stats</span></button>
    <button class="tab" data-tab="settings"><span class="ico">⚙️</span><span data-i18n="settings">Settings</span></button>
  </nav>
</div>

<div class="modal" id="addModal">
  <div class="sheet">
    <h2><span data-i18n="addTrade">Add trade</span><button class="sheet-close" data-close="addModal">✕</button></h2>
    <input class="amount-input" id="fAmount" type="text" inputmode="decimal" placeholder="0.00"/>
    <div class="type-row">
      <button class="type-btn win on" data-type="win"><span class="e">🟢</span><span data-i18n="win">Win</span></button>
      <button class="type-btn loss" data-type="loss"><span class="e">🔴</span><span data-i18n="loss">Loss</span></button>
    </div>
    <input class="note-input" id="fNote" type="text" maxlength="60" placeholder="📝" data-i18n-ph="notePh"/>
    <button class="btn btn-primary" id="saveBtn"><span data-i18n="save">Save</span> ✨</button>
  </div>
</div>

<div class="modal" id="langModal">
  <div class="sheet">
    <h2>🌐 <span data-i18n="language">Language</span><button class="sheet-close" data-close="langModal">✕</button></h2>
    <div class="lang-list" id="langList"></div>
  </div>
</div>

<div id="toast"></div>

};

function t(k){ const d = L[state.lang] || L.en; return d[k] !== undefined ? d[k] : (L.en[k] || k); }

const DEFAULT_STATE = () => ({
  version:1,
  lang:(navigator.language||'en').slice(0,2) in L ? (navigator.language||'en').slice(0,2) : 'en',
  theme:'play', currency:'USD', trades:[]
});
let state = (() => { try { const s = JSON.parse(localStorage.getItem('pip_v1')); return s ? Object.assign(DEFAULT_STATE(), s) : DEFAULT_STATE(); } catch(e){ return DEFAULT_STATE(); } })();
function saveState(){ try { localStorage.setItem('pip_v1', JSON.stringify(state)); } catch(e){} }

function fmtMoney(n){ try { return new Intl.NumberFormat(state.lang,{style:'currency',currency:state.currency,maximumFractionDigits:2}).format(n); } catch(e){ return n.toFixed(2)+' '+state.currency; } }
function fmtDate(d){ try { return new Intl.DateTimeFormat(state.lang,{day:'numeric',month:'long',weekday:'short'}).format(d); } catch(e){ return d.toDateString(); } }
function fmtMonth(d){ try { return new Intl.DateTimeFormat(state.lang,{month:'long',year:'numeric'}).format(d); } catch(e){ return d.toDateString(); } }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function dateKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

let audioCtx = null;
function ac(){ if(!audioCtx) try { audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} if(audioCtx && audioCtx.state==='suspended') audioCtx.resume(); return audioCtx; }
function playSave(){ const c = ac(); if(!c) return; [523,659,784,1047].forEach((f,i)=>{ const o=c.createOscillator(),g=c.createGain(); o.type='sine'; o.frequency.value=f; const t0=c.currentTime+i*.08; g.gain.setValueAtTime(.001,t0); g.gain.exponentialRampToValueAtTime(.18,t0+.02); g.gain.exponentialRampToValueAtTime(.001,t0+.4); o.connect(g).connect(c.destination); o.start(t0); o.stop(t0+.45); }); }
function playPop(){ const c=ac(); if(!c) return; const o=c.createOscillator(),g=c.createGain(); o.type='sine'; o.frequency.setValueAtTime(400,c.currentTime); o.frequency.exponentialRampToValueAtTime(200,c.currentTime+.15); g.gain.setValueAtTime(.2,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.18); o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+.2); }
function haptic(p){ if(navigator.vibrate) try { navigator.vibrate(p); } catch(e){} }
function addRipple(e){ const btn=e.currentTarget; const rect=btn.getBoundingClientRect(); const size=Math.max(rect.width,rect.height); const r=document.createElement('span'); r.className='ripple'; r.style.width=r.style.height=size+'px'; r.style.left=(e.clientX-rect.left-size/2)+'px'; r.style.top=(e.clientY-rect.top-size/2)+'px'; btn.appendChild(r); setTimeout(()=>r.remove(),650); }

function tradesFor(d){ const k=dateKey(d); return state.trades.filter(x=>x.date===k); }

let currentTab='calendar';
let currentMonth=new Date(); currentMonth.setDate(1);
let selectedDate=new Date();
const app = document.getElementById('view');

function render(){
  if(currentTab==='calendar') renderCalendar();
  else if(currentTab==='stats') renderStats();
  else if(currentTab==='settings') renderSettings();
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===currentTab));
  applyI18n();
}

function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent=t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{ el.placeholder=t(el.dataset.i18nPh); });
  document.documentElement.lang=state.lang;
  document.documentElement.dir=['ar','he','fa','ur'].includes(state.lang)?'rtl':'ltr';
}

function renderCalendar(){
  const y=currentMonth.getFullYear(), m=currentMonth.getMonth();
  const firstDay=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  let monthTotal=0;
  state.trades.forEach(x=>{ const [ty,tm]=x.date.split('-').map(Number); if(ty===y && tm===m+1) monthTotal += x.type==='win'?x.amount:-x.amount; });
  const wdNames=[]; for(let i=0;i<7;i++){ const d=new Date(2024,0,7+i); wdNames.push(new Intl.DateTimeFormat(state.lang,{weekday:'narrow'}).format(d)); }
  let cells=''; wdNames.forEach(w=>cells+=`<div class="wd">${w}</div>`);
  for(let i=0;i<firstDay;i++) cells+='<div class="day empty"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const dt=new Date(y,m,d);
    const trades=tradesFor(dt);
    const net=trades.reduce((a,x)=>a+(x.type==='win'?x.amount:-x.amount),0);
    let cls='day';
    if(trades.length>0) cls+=net>0?' win':net<0?' loss':' neutral';
    if(sameDay(dt,new Date())) cls+=' today';
    if(sameDay(dt,selectedDate)) cls+=' sel';
    cells+=`<div class="${cls}" data-day="${d}" style="animation-delay:${d*15}ms"><span class="n">${d}</span>${trades.length?`<span class="amt">${net>=0?'+':''}${Math.round(net)}</span>`:''}</div>`;
  }
  const mood=monthTotal>0?'😊':monthTotal<0?'😐':'🙂';
  const cls=monthTotal>0?'pos':monthTotal<0?'neg':'neu';
  const dayTrades=tradesFor(selectedDate);
  const dayList=dayTrades.length===0?`<div class="empty-detail">${t('noTrades')}</div>`:dayTrades.map(x=>`<div class="trade-row ${x.type}"><span class="ico">${x.type==='win'?'🟢':'🔴'}</span><span class="note">${escapeHtml(x.note)||(x.type==='win'?t('win'):t('loss'))}</span><span class="amt">${x.type==='win'?'+':'-'}${fmtMoney(x.amount)}</span></div>`).join('');
  app.innerHTML=`
    <div class="view">
      <div class="month-card ${cls}">
        <div class="mood">${mood}</div>
        <div class="month-name">${fmtMonth(currentMonth)}</div>
        <div class="month-total">${t('monthTotal')}: <b>${monthTotal>=0?'+':''}${fmtMoney(monthTotal)}</b></div>
      </div>
      <div class="cal-nav">
        <button class="nav-btn big" data-nav="prev">‹</button>
        <button class="nav-btn" data-nav="today">${t('today')}</button>
        <button class="nav-btn big" data-nav="next">›</button>
      </div>
      <div class="calendar">${cells}</div>
      <div class="detail-card">
        <div class="detail-title">${t('dayDetail')} · ${fmtDate(selectedDate)}</div>
        <div class="detail-list">${dayList}</div>
      </div>
      <div style="height:100px"></div>
    </div>`;
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=(e)=>{ addRipple(e); haptic(10); if(b.dataset.nav==='prev') currentMonth.setMonth(currentMonth.getMonth()-1); else if(b.dataset.nav==='next') currentMonth.setMonth(currentMonth.getMonth()+1); else { currentMonth=new Date(); currentMonth.setDate(1); selectedDate=new Date(); } render(); });
  document.querySelectorAll('[data-day]').forEach(c=>c.onclick=(e)=>{ addRipple(e); haptic(10); playPop(); const d=parseInt(c.dataset.day); selectedDate=new Date(currentMonth.getFullYear(),currentMonth.getMonth(),d); render(); });
}

function renderStats(){
  const all=state.trades;
  const total=all.reduce((a,x)=>a+(x.type==='win'?x.amount:-x.amount),0);
  const wins=all.filter(x=>x.type==='win').length;
  const winRate=all.length?Math.round((wins/all.length)*100):0;
  const dayMap={}; all.forEach(x=>{ dayMap[x.date]=(dayMap[x.date]||0)+(x.type==='win'?x.amount:-x.amount); });
  const sorted=Object.entries(dayMap).sort((a,b)=>b[1]-a[1]);
  const best=sorted[0]; const worst=sorted[sorted.length-1];
  const uniqueDays=new Set(all.map(x=>x.date));
  let streak=0; const today=new Date();
  for(let i=0;i<365;i++){ const d=new Date(today); d.setDate(d.getDate()-i); if(uniqueDays.has(dateKey(d))) streak++; else if(i>0) break; }
  const badgeDefs=[
    {key:'badgeFirst',on:all.length>=1,e:'🏅'},
    {key:'badge10',on:all.length>=10,e:'🎯'},
    {key:'badge50',on:all.length>=50,e:'🚀'},
    {key:'badgeStreak',on:streak>=7,e:'🔥'},
    {key:'badgeWin',on:wins>=10,e:'⭐'},
    {key:'badgeMonth',on:Object.keys(dayMap).length>=30,e:'📅'}
  ];
  app.innerHTML=`
    <div class="view">
      <div class="stat-hero">
        <div class="lbl">${t('totalBalance')}</div>
        <div class="val">${total>=0?'+':''}${fmtMoney(total)}</div>
        <div class="sub">${all.length} ${t('total').toLowerCase()}</div>
      </div>
      <div class="stat-grid">
        <div class="stat-card ${winRate>=50?'good':'bad'}"><div class="e">🎯</div><div class="lbl">${t('winRate')}</div><div class="val">${winRate}%</div></div>
        <div class="stat-card ${streak>0?'good':''}"><div class="e">🔥</div><div class="lbl">${t('streak')}</div><div class="val">${streak} ${t('days')}</div></div>
        <div class="stat-card good"><div class="e">🏆</div><div class="lbl">${t('bestDay')}</div><div class="val">${best?'+'+fmtMoney(best[1]):'—'}</div></div>
        <div class="stat-card bad"><div class="e">💔</div><div class="lbl">${t('worstDay')}</div><div class="val">${worst?fmtMoney(worst[1]):'—'}</div></div>
      </div>
      <div class="section-title">${t('badges')}</div>
      <div class="badges">${badgeDefs.map(b=>`<div class="badge ${b.on?'on':''}"><div class="e">${b.e}</div><div class="n">${t(b.key)}</div></div>`).join('')}</div>
      <div style="height:100px"></div>
    </div>`;
}

function renderSettings(){
  const currencies=['USD','EUR','GBP','JPY','CNY','INR','SAR','AED','EGP','TRY','BRL','RUB','KRW','MXN','ZAR','NGN','BTC','ETH','USDT'];
  app.innerHTML=`
    <div class="view">
      <div class="section-title">${t('settings')}</div>
      <div class="set-card">
        <div class="set-row"><div><div class="lbl">${t('language')}</div><div class="sub">${L[state.lang].name}</div></div><button class="icon-btn" id="setLangBtn" style="font-size:22px">${L[state.lang].flag}</button></div>
        <div class="set-row"><div><div class="lbl">${t('theme')}</div><div class="sub">${state.theme==='play'?t('themePlay'):t('themeCalm')}</div></div><div class="toggle ${state.theme==='calm'?'on':''}" id="themeToggle"></div></div>
        <div class="set-row"><div><div class="lbl">${t('currency')}</div></div><select id="curSel">${currencies.map(c=>`<option value="${c}" ${state.currency===c?'selected':''}>${c}</option>`).join('')}</select></div>
      </div>
      <div class="section-title">${t('data')}</div>
      <div class="set-card">
        <div class="set-row"><div><div class="lbl">${t('export')}</div><div class="sub">JSON</div></div><button class="btn btn-ghost" style="width:auto;padding:10px 16px;margin:0;font-size:13px" id="exportBtn">${t('export')}</button></div>
        <div class="set-row"><div><div class="lbl">${t('reset')}</div></div><button class="btn btn-danger" style="width:auto;padding:10px 16px;margin:0;font-size:13px" id="resetBtn">${t('reset')}</button></div>
      </div>
      <div style="text-align:center;color:var(--mut);font-size:11px;padding:20px;line-height:1.6">Pip · 100% offline · Your data stays here</div>
      <div style="height:100px"></div>
    </div>`;
  document.getElementById('setLangBtn').onclick=()=>{ haptic(10); openLangModal(); };
  document.getElementById('themeToggle').onclick=(e)=>{ addRipple(e); haptic(15); state.theme=state.theme==='play'?'calm':'play'; saveState(); applyTheme(); renderSettings(); };
  document.getElementById('curSel').onchange=(e)=>{ state.currency=e.target.value; saveState(); toast(t('saved')); };
  document.getElementById('exportBtn').onclick=()=>{ haptic(15); const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='pip-backup.json'; document.body.appendChild(a); a.click(); a.remove(); toast(t('saved')); };
  document.getElementById('resetBtn').onclick=()=>{ if(confirm(t('resetConfirm'))){ state.trades=[]; saveState(); render(); toast(t('deleted')); } };
}

let newType='win';
function openAddTrade(){
  document.getElementById('fAmount').value='';
  document.getElementById('fNote').value='';
  newType='win';
  document.querySelectorAll('.type-btn').forEach(b=>b.classList.toggle('on',b.dataset.type==='win'));
  document.getElementById('addModal').classList.add('open');
  setTimeout(()=>document.getElementById('fAmount').focus(),100);
}
function saveTrade(){
  const amount=parseFloat(document.getElementById('fAmount').value.replace(',','.').replace(/[^\d.]/g,''));
  if(!amount||amount<=0){ toast('⚠️'); return; }
  const note=document.getElementById('fNote').value.trim();
  state.trades.push({id:'t_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),date:dateKey(selectedDate),amount,type:newType,note,ts:Date.now()});
  saveState();
  document.getElementById('addModal').classList.remove('open');
  haptic(newType==='win'?[20,40,20]:[40]);
  playSave();
  toast(newType==='win'?t('pipYes'):t('pipNo'));
  render();
}

function openLangModal(){
  const list=document.getElementById('langList');
  list.innerHTML=Object.entries(L).map(([code,d])=>`<button class="lang-btn ${state.lang===code?'on':''}" data-lang="${code}"><span class="flag">${d.flag}</span><span>${d.name}</span></button>`).join('');
  list.querySelectorAll('[data-lang]').forEach(b=>b.onclick=(e)=>{ addRipple(e); haptic(15); state.lang=b.dataset.lang; saveState(); applyI18n(); document.getElementById('langModal').classList.remove('open'); render(); });
  document.getElementById('langModal').classList.add('open');
}

function applyTheme(){
  if(state.theme==='calm') document.documentElement.setAttribute('data-theme','calm');
  else document.documentElement.removeAttribute('data-theme');
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content',state.theme==='calm'?'#F5F7FA':'#4DB8FF');
}

let toastTimer;
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2000); }
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function boot(){
  applyTheme(); applyI18n(); selectedDate=new Date();
  document.querySelectorAll('.tab').forEach(b=>b.onclick=(e)=>{ addRipple(e); haptic(10); playPop(); currentTab=b.dataset.tab; render(); });
  document.getElementById('fab').onclick=(e)=>{ addRipple(e); haptic(15); openAddTrade(); };
  document.getElementById('langBtn').onclick=()=>{ haptic(10); openLangModal(); };
  document.getElementById('themeBtn').onclick=(e)=>{ addRipple(e); haptic(15); state.theme=state.theme==='play'?'calm':'play'; saveState(); applyTheme(); if(currentTab==='settings') renderSettings(); };
  document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.close).classList.remove('open'));
  document.querySelectorAll('.type-btn').forEach(b=>b.onclick=(e)=>{ addRipple(e); haptic(10); playPop(); newType=b.dataset.type; document.querySelectorAll('.type-btn').forEach(x=>x.classList.toggle('on',x===b)); });
  document.getElementById('saveBtn').onclick=(e)=>{ addRipple(e); saveTrade(); };
  document.querySelectorAll('.modal').forEach(m=>{ m.onclick=(e)=>{ if(e.target===m) m.classList.remove('open'); }; });
  render();
}

document.addEventListener('DOMContentLoaded', boot);

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
